<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>amazon</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="yoyo-top" id="header">
      <div class="yoyo-top-inner clearfix" id="header-inner">
        <div class="yoyo-logo">
          <span class="yoyo-logo-word">amazon</span>
        </div>

        <div class="yoyo-loc" id="delivery-location">
          <p class="yoyo-loc-hello">deliver to</p>
          <p class="yoyo-loc-country">hongkong</p>
        </div>

        <div class="yoyo-search" id="search-area">
          <div class="yoyo-search-cat">all</div>
          <input
            class="yoyo-search-input"
            type="text"
            placeholder="Search Amazon"
          />
          <div class="yoyo-search-btn">search amazon</div>
        </div>

        <div class="yoyo-account">
          <p class="yoyo-small">hello, sign in</p>
          <p class="yoyo-line">account & lists</p>
        </div>

        <div class="yoyo-orders">
          <p class="yoyo-small">returns</p>
          <p class="yoyo-line">& orders</p>
        </div>

        <div class="yoyo-cart">
          <span class="yoyo-cart-count">0</span>
          <span class="yoyo-cart-word">cart</span>
        </div>
      </div>
    </div>

    <div class="yoyo-nav" id="main-nav">
      <div class="yoyo-nav-inner">
        <div class="yoyo-nav-item yoyo-nav-item-first">all</div>
        <div class="yoyo-nav-item">amazon bazaar</div>
        <div class="yoyo-nav-item">prime video</div>
        <div class="yoyo-nav-item">coupons</div>
        <div class="yoyo-nav-item">customer service</div>
        <div class="yoyo-nav-item">today's deals</div>
        <div class="yoyo-nav-item">registry</div>
        <div class="yoyo-nav-item">gift cards</div>
        <div class="yoyo-nav-item">sell</div>
      </div>
    </div>
  </body>
</html>
